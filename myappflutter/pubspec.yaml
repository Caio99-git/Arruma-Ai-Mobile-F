name: myappflutter
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  ios: true
  android: false
  image_path: "assets/logo-arrumaai.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/logo-arrumaai.png
    - assets/google.png
    - assets/apple.png